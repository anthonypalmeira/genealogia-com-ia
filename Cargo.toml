[package]
name = "garimpo"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "CLI for AI agents to research genealogy on FamilySearch within the account limits"
license = "MIT"
publish = false

[dependencies]
anyhow = "1.0.105"
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.9", features = ["derive", "env"] }
form_urlencoded = "1.2.3"
gedcomx = "0.1.8"
getrandom = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tiny_http = "0.12.0"
ureq = { version = "3.5.2", features = ["json"] }

[lints.rust]
unreachable_pub = "warn"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"
undocumented_unsafe_blocks = "warn"
