# Dependency policy. Security advisories belong to `cargo audit`.

[bans]
multiple-versions = "warn"
wildcards = "deny"

[licenses]
# Permissive licenses, compatible with distributing garimpo under MIT.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
