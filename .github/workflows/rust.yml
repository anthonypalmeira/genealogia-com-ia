name: Rust

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Every Monday: new security advisories in the dependencies.
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Installs the version pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: jdx/mise-action@v5
      - name: Recorded responses hold no token and no living person
        run: |
          if grep -rniE '"living" *: *true|bearer|access_token|sessionid' tests/fixtures; then
            echo "::error::recorded responses must not hold a token or a living person"
            exit 1
          fi
      # The SVG test renders with Pele, which the renderer's folder pins.
      - run: bun install --frozen-lockfile
        working-directory: svg
      - run: bun run typecheck
        working-directory: svg
      - run: cargo nextest run --workspace --all-features --locked
      - run: cargo test --workspace --doc --locked
      - run: cargo build --release --locked

  dependencies:
    name: Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: jdx/mise-action@v5
      - run: cargo audit
      - run: cargo deny check bans licenses sources
      - run: cargo machete

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - run: rustup component add llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: jdx/mise-action@v5
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - run: bun install --frozen-lockfile
        working-directory: svg
      # Report only: there is no coverage target.
      - run: cargo llvm-cov nextest --workspace --all-features --locked
