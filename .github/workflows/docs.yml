name: docs

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Testes da checagem
        run: python3 -m unittest discover -s scripts
      # The check builds the CLI to read its help; installs the version pinned
      # in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Links, frontmatter das skills, comandos do garimpo e dados pessoais
        run: python3 scripts/checar_docs.py
