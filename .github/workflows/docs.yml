name: docs

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Testes da checagem
        run: python3 -m unittest discover -s scripts
      - name: Links, frontmatter das skills e dados pessoais
        run: python3 scripts/checar_docs.py
